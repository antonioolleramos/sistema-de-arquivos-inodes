<path d="M33 18 H817 Q833 18 833 35 V60 H17 V35 Q17 18 33 18" fill="#172434"/>
<circle cx="40" cy="40" r="6" fill="#fb7185"/><circle cx="63" cy="40" r="6" fill="#fbbf24"/><circle cx="86" cy="40" r="6" fill="#34d399"/>
<text class="header" x="124" y="46">Sistema de Arquivos · i-nodes</text>
<text class="foot" x="682" y="45">Python · CLI</text>
<path d="M40 101 H810 M40 358 H810" stroke="#2b4156" stroke-width="1"/>
<text class="foot" x="40" y="384">Execução real de main.py · dados fictícios · comandos Unix simplificados</text><g class="scene" style="animation:scene0 27s linear infinite;opacity:1;"><text class="title" x="40" y="88">INICIO DO SISTEMA · 1/6</text><text class="line cmd" x="40" y="136">$ python3 main.py</text><text class="line" x="40" y="162">Sistema de arquivos iniciado. Digite exit para sair.</text><text class="line" x="40" y="188">Primeira execução: defina a senha do usuário root.</text><text class="line" x="40" y="214">login: root</text><text class="line" x="40" y="240">Bem-vindo(a), root.</text><text class="line cmd" x="40" y="266">root@myfs&gt; </text></g><g class="scene" style="animation:scene1 27s linear infinite;"><text class="title" x="40" y="88">CRIAR E ENTRAR EM DIRETORIO · 2/6</text><text class="line cmd" x="40" y="136">root@myfs&gt; mkdir projetos</text><text class="line cmd" x="40" y="162">root@myfs&gt; cd projetos</text><text class="line cmd" x="40" y="188">root@myfs&gt; </text></g><g class="scene" style="animation:scene2 27s linear infinite;"><text class="title" x="40" y="88">ESCRITA E LEITURA · 3/6</text><text class="line cmd" x="40" y="136">root@myfs&gt; echo &quot;Ola, sistema de arquivos!&quot; &gt; exemplo.txt</text><text class="line cmd" x="40" y="162">root@myfs&gt; cat exemplo.txt</text><text class="line" x="40" y="188">Ola, sistema de arquivos!</text><text class="line cmd" x="40" y="214">root@myfs&gt; </text></g><g class="scene" style="animation:scene3 27s linear infinite;"><text class="title" x="40" y="88">COPIAR, RENOMEAR E LINK · 4/6</text><text class="line cmd" x="40" y="136">root@myfs&gt; cp exemplo.txt copia.txt</text><text class="line cmd" x="40" y="162">root@myfs&gt; mv copia.txt final.txt</text><text class="line cmd" x="40" y="188">root@myfs&gt; ln -s exemplo.txt atalho.txt</text><text class="line cmd" x="40" y="214">root@myfs&gt; </text></g><g class="scene" style="animation:scene4 27s linear infinite;"><text class="title" x="40" y="88">LISTAGEM COM PERMISSOES · 5/6</text><text class="line cmd" x="40" y="136">root@myfs&gt; ls -l</text><text class="line" x="40" y="162">drwr-  root             74  .</text><text class="line" x="40" y="188">drw--  root             42  ..</text><text class="line" x="40" y="214">-rwr-  root             25  exemplo.txt</text><text class="line" x="40" y="240">-rwr-  root             25  final.txt</text><text class="line" x="40" y="266">lrwr-  root             11  atalho.txt</text><text class="line cmd" x="40" y="292">root@myfs&gt; </text></g><g class="scene" style="animation:scene5 27s linear infinite;"><text class="title" x="40" y="88">REMOCAO E CONFERENCIA · 6/6</text><text class="line cmd" x="40" y="136">root@myfs&gt; rm final.txt</text><text class="line cmd" x="40" y="162">root@myfs&gt; ls</text><text class="line" x="40" y="188">.</text><text class="line" x="40" y="214">..</text><text class="line" x="40" y="240">exemplo.txt</text><text class="line" x="40" y="266">atalho.txt</text><text class="line cmd" x="40" y="292">root@myfs&gt; </text></g></svg>