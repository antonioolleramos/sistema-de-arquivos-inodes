  .header {font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f6f8fa}
  .foot {font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}
