<svg xmlns="http://www.w3.org/2000/svg" width="850" height="420" viewBox="0 0 850 420" role="img" aria-label="Demonstração animada em terminal do sistema de arquivos baseado em i-nodes">
<title>Sistema de Arquivos · Demonstração no Terminal</title>
<style>
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes scene0{0%,16.62%{opacity:1}16.67%,100%{opacity:0}}@keyframes scene1{0%,16.67%{opacity:0}16.72%,33.28%{opacity:1}33.33%,100%{opacity:0}}@keyframes scene2{0%,33.33%{opacity:0}33.38%,49.95%{opacity:1}50.00%,100%{opacity:0}}@keyframes scene3{0%,50.00%{opacity:0}50.05%,66.62%{opacity:1}66.67%,100%{opacity:0}}@keyframes scene4{0%,66.67%{opacity:0}66.72%,83.28%{opacity:1}83.33%,100%{opacity:0}}@keyframes scene5{0%,83.33%{opacity:0}83.38%,99.95%{opacity:1}100.00%,100%{opacity:0}}
  .scene {opacity:0}
  .title {font: 700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#72e4bb}
  .line {font: 15px "DejaVu Sans Mono",Consolas,monospace;fill:#bed3df;white-space:pre}
